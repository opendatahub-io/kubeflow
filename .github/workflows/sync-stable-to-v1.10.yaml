name: Sync stable → v1.10-branch (PR)

on:
  schedule:
    # Offset from main→stable (06:00) so the stream hop usually lands first.
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: sync-via-pr-stable-to-v1.10
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    uses: ./.github/workflows/sync-via-pr.yaml
    secrets: inherit
    permissions:
      contents: write
    with:
      source: stable
      target: v1.10-branch
      merge_branch: sync/stable-to-v1.10
      pr_title: "chore: sync stable → v1.10-branch"
      pr_body: |
        Automated daily sync of `stable` into `v1.10-branch`.

        **What this PR does**
        - Merges all commits from `stable` that are not yet in `v1.10-branch`.
        - Keeps the `v1.10-branch` version of `.tekton/` and the known version-pinned files.

        **Review checklist**
        - [ ] Diff looks as expected (no unintended version bumps or config changes)
        - [ ] CI is green

        > Generated by the *Sync stable → v1.10-branch (PR)* workflow.
