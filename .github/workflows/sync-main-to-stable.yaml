name: Sync main → stable (PR)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    uses: ./.github/workflows/sync-via-pr.yaml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      source: main
      target: stable
      merge_branch: sync/main-to-stable
      pr_title: "chore: sync main → stable"
      pr_body: |
        Automated daily sync of `main` into `stable`.

        **What this PR does**
        - Merges all commits from `main` that are not yet in `stable`.
        - Keeps the `stable` version of `.tekton/` and the known version-pinned files.

        **Review checklist**
        - [ ] Diff looks as expected (no unintended version bumps or config changes)
        - [ ] CI is green

        > Generated by the *Sync main → stable (PR)* workflow.
