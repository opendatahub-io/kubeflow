name: Sync main → stable (PR)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

permissions: {}

env:
  SOURCE_BRANCH: main
  TARGET_BRANCH: stable

jobs:
  sync-main-to-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Set up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Check if main has new commits not in stable
      id: check
      run: |
        git fetch origin ${{ env.SOURCE_BRANCH }} ${{ env.TARGET_BRANCH }}
        AHEAD=$(git rev-list --count origin/${{ env.TARGET_BRANCH }}..origin/${{ env.SOURCE_BRANCH }})
        echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
        if [[ "$AHEAD" -eq 0 ]]; then
          echo "stable is already up to date with main. Nothing to do."
        else
          echo "$AHEAD commit(s) in main not yet in stable."
        fi

    - name: Create merge branch and apply changes
      if: steps.check.outputs.ahead != '0'
      id: merge
      run: |
        set -e

        MERGE_BRANCH="sync/main-to-stable-$(date +%Y%m%d)"
        echo "merge_branch=$MERGE_BRANCH" >> "$GITHUB_OUTPUT"

        # Start from target branch
        git fetch origin ${{ env.TARGET_BRANCH }}:${{ env.TARGET_BRANCH }}
        git checkout -b "$MERGE_BRANCH" ${{ env.TARGET_BRANCH }}

        # Merge source branch (no auto-commit so we can fixup below)
        git fetch origin ${{ env.SOURCE_BRANCH }}:${{ env.SOURCE_BRANCH }}
        git merge --no-commit origin/${{ env.SOURCE_BRANCH }} || true

        #######################################################################
        # Always keep target branch state for .tekton
        # (do not propagate any .tekton changes from source branch).
        git rm -r -f --cached --ignore-unmatch -- ':/.tekton'
        rm -rf -- "$(git rev-parse --show-toplevel)/.tekton"

        if git rev-parse --verify HEAD:.tekton >/dev/null 2>&1; then
          echo "Keeping target branch version of .tekton."
          git checkout HEAD -- ':/.tekton'
          git add -A -- ':/.tekton'
        fi
        #######################################################################

        # Known files: keep target branch version on conflict
        FILES=(
          "components/notebook-controller/config/overlays/openshift/params.env"
          "components/odh-notebook-controller/config/overlays/odh/params.env"
          "components/odh-notebook-controller/config/overlays/rhoai/params.env"
          "components/odh-notebook-controller/makefile-vars.mk"
        )

        for FILE in "${FILES[@]}"; do
          if [[ -f "$FILE" && "$(git status --porcelain=v1 2>/dev/null | grep -c "$FILE")" -gt 0 ]]; then
            echo "Resolving conflict for $FILE by keeping target branch version."
            git checkout --ours "$FILE"
            git add "$FILE"
          fi
        done

        # Fail fast on unexpected conflicts
        if [[ -n "$(git ls-files -u)" ]]; then
          echo "Unresolved conflicts detected in the following files:"
          git ls-files -u
          echo "Aborting — manual intervention required."
          exit 1
        fi

        if [[ -n "$(git status --porcelain)" ]]; then
          git commit -m "chore: sync main → stable ($(date +%Y-%m-%d))"
        fi

        if git diff --quiet origin/${{ env.TARGET_BRANCH }} HEAD; then
          echo "Merge branch is identical to stable. Skipping PR creation."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git push origin "$MERGE_BRANCH"

    - name: Open pull request
      if: steps.check.outputs.ahead != '0' && steps.merge.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Defined here so backticks are plain YAML characters, avoiding
        # heredoc-inside-run indentation issues that break YAML parsing.
        PR_BODY: |
          Automated daily sync of `main` into `stable`.

          **What this PR does**
          - Merges all commits from `main` that are not yet in `stable`.
          - Keeps the `stable` version of `.tekton/` and the known version-pinned files.

          **Review checklist**
          - [ ] Diff looks as expected (no unintended version bumps or config changes)
          - [ ] CI is green

          > Generated by the *Sync main → stable (PR)* workflow.
      run: |
        MERGE_BRANCH="${{ steps.merge.outputs.merge_branch }}"

        # Reuse an existing open PR for the same branch if one exists.
        # Use `// empty` so jq emits nothing (not "null") on an empty list.
        EXISTING=$(gh pr list \
          --head "$MERGE_BRANCH" \
          --base ${{ env.TARGET_BRANCH }} \
          --state open \
          --json number \
          --jq '.[0].number // empty')

        if [[ -n "$EXISTING" ]]; then
          echo "PR #$EXISTING already open for $MERGE_BRANCH — no duplicate created."
          exit 0
        fi

        gh pr create \
          --base ${{ env.TARGET_BRANCH }} \
          --head "$MERGE_BRANCH" \
          --title "chore: sync main → stable ($(date +%Y-%m-%d))" \
          --body "$PR_BODY"
