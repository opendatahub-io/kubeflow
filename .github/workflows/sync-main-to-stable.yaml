name: Sync main → stable (PR)

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

permissions: {}

env:
  SOURCE_BRANCH: main
  TARGET_BRANCH: stable

jobs:
  # ── 1. Check whether main has commits not yet in stable ──────────────────────
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ahead: ${{ steps.check.outputs.ahead }}
      merge_branch: ${{ steps.name.outputs.merge_branch }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check if main has new commits not in stable
      id: check
      run: |
        git fetch origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
        AHEAD=$(git rev-list --count "origin/$TARGET_BRANCH".."origin/$SOURCE_BRANCH")
        echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
        if [[ "$AHEAD" -eq 0 ]]; then
          echo "stable is already up to date with main. Nothing to do."
        else
          echo "$AHEAD commit(s) in main not yet in stable."
        fi

    - name: Set merge branch name
      id: name
      run: echo "merge_branch=sync/main-to-stable-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

  # ── 2. Create the merge branch and apply changes (shared logic) ───────────────
  # Delegates to sync-branches so the merge/conflict-resolution logic lives in
  # one place and is reused by any future sync workflow (e.g. stable→v1.10-branch).
  sync:
    needs: check
    if: needs.check.outputs.ahead != '0'
    uses: ./.github/workflows/sync-branches.yaml
    permissions:
      contents: write
    with:
      source: main
      target: ${{ needs.check.outputs.merge_branch }}
      base: stable

  # ── 3. Open (or reuse) a pull request ─────────────────────────────────────────
  create-pr:
    needs: [check, sync]
    if: needs.check.outputs.ahead != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Defined here so backticks are plain YAML characters, avoiding
      # heredoc-inside-run indentation issues that break YAML parsing.
      PR_BODY: |
        Automated daily sync of `main` into `stable`.

        **What this PR does**
        - Merges all commits from `main` that are not yet in `stable`.
        - Keeps the `stable` version of `.tekton/` and the known version-pinned files.

        **Review checklist**
        - [ ] Diff looks as expected (no unintended version bumps or config changes)
        - [ ] CI is green

        > Generated by the *Sync main → stable (PR)* workflow.
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check if merge branch was pushed and differs from stable
      id: diff_check
      env:
        MERGE_BRANCH: ${{ needs.check.outputs.merge_branch }}
      run: |
        # Fetch the specific sync branch by name — git fetch origin without args
        # uses the checkout refspec which may not include newly created branches.
        git fetch origin "$TARGET_BRANCH" "$MERGE_BRANCH" 2>/dev/null || \
          git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
        # sync-branches skips the push when the merged result is identical to the
        # target (e.g. all incoming changes were to protected files).
        if ! git rev-parse --verify "origin/${MERGE_BRANCH}" >/dev/null 2>&1; then
          echo "Merge branch was not pushed — no effective changes after protected-path restore. Skipping PR."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Guard against a merge branch whose tree is identical to stable (should
        # not happen given the push-skip above, but kept as a safety net).
        if git diff --quiet "origin/$TARGET_BRANCH" "origin/${MERGE_BRANCH}"; then
          echo "Merge branch tree is identical to stable. Skipping PR."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Open or reuse pull request
      if: steps.diff_check.outputs.skip != 'true'
      env:
        MERGE_BRANCH: ${{ needs.check.outputs.merge_branch }}
      run: |
        # Reuse an existing open PR for the same branch if one exists.
        # Use `// empty` so jq emits nothing (not "null") on an empty list.
        EXISTING=$(gh pr list \
          --head "$MERGE_BRANCH" \
          --base "$TARGET_BRANCH" \
          --state open \
          --json number \
          --jq '.[0].number // empty')

        if [[ -n "$EXISTING" ]]; then
          echo "PR #$EXISTING already open for $MERGE_BRANCH — no duplicate created."
          exit 0
        fi

        gh pr create \
          --base "$TARGET_BRANCH" \
          --head "$MERGE_BRANCH" \
          --title "chore: sync main → stable ($(date +%Y-%m-%d))" \
          --body "$PR_BODY"
