name: TLS Config Lint
on:
  pull_request:
    branches: [main, master, dev, odh, incubating, stable-2.x]

permissions:
  contents: read
  security-events: write

jobs:
  tls-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: sebrandon1/tls-config-lint@a0d87d039a8d0c869c4bb535d013623eb93fa443 # v1
        id: lint
        with:
          severity-threshold: high
          sarif-output: tls-lint.sarif
          exclude-dirs: vendor,node_modules,test/fixtures

      - uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        if: always()
        with:
          sarif_file: tls-lint.sarif
