# https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(gha)"
    # Copied from opendatahub-io/security-config by security-config-sync.
    # Local version bumps are overwritten on the next sync, so update the
    # template there instead of opening Dependabot PRs here.
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#exclude-paths
    exclude-paths:
      - ".github/workflows/tls-lint.yml"
      - ".github/workflows/semgrep-tls.yml"

  # Security update PRs only. `open-pull-requests-limit: 0` disables version
  # updates; the `ignore.update-types` rules do the same and do not apply to
  # security updates.
  # https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates#overriding-the-default-behavior-with-a-configuration-file
  # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit
  #
  # Security PRs also need to be enabled in the repository settings:
  # https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates#enabling-or-disabling-dependabot-security-updates-for-an-individual-repository
  #
  # `directories` lets one group update every module below in a single PR.
  # Groups cover families that must move together. A dependency that matches
  # no group still gets its own security PR. There is no "*" group, so
  # unrelated packages are not batched together.

  - package-ecosystem: "gomod"
    directories:
      - "/components/notebook-controller"
      - "/components/odh-notebook-controller"
      - "/components/common"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "go.opentelemetry.io/*"
      golang-org:
        applies-to: security-updates
        patterns:
          - "golang.org/*"
      kubernetes:
        applies-to: security-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      google-golang:
        applies-to: security-updates
        patterns:
          - "google.golang.org/*"
      openapi:
        applies-to: security-updates
        patterns:
          - "github.com/go-openapi/*"
      prometheus:
        applies-to: security-updates
        patterns:
          - "github.com/prometheus/*"
