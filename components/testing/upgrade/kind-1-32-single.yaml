# Single-node KinD config for local upgrade tests.
# Multi-node (control-plane + worker) often fails under rootless Podman during
# kubeadm join; one node is enough for this harness. CI GHA uses Docker and
# components/testing/gh-actions/kind-1-32.yaml (2 nodes).
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    metadata:
      name: config
    apiServer:
      extraArgs:
        "service-account-issuer": "kubernetes.default.svc"
        "service-account-signing-key-file": "/etc/kubernetes/pki/sa.key"
nodes:
- role: control-plane
  image: kindest/node:v1.32.8@sha256:abd489f042d2b644e2d033f5c2d900bc707798d075e8186cb65e3f1367a9d5a1
