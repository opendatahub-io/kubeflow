apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- rbac
- monitor.yaml
namespace: opendatahub
replacements:
- source:
    fieldPath: metadata.namespace
    group: monitoring.coreos.com
    kind: ServiceMonitor
    name: odh-notebook-controller-metrics-monitor
    version: v1
  targets:
  - fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: .
      index: 1
    select:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: odh-notebook-controller-metrics-monitor
      version: v1
patches:
- path: manager_tls_patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: odh-notebook-controller-manager
- path: manager_tls_args_patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: odh-notebook-controller-manager
- path: tls_service_patch.yaml
  target:
    group: ""
    version: v1
    kind: Service
    name: odh-notebook-controller-service
