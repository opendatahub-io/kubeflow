apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odh-notebook-controller-allow-ports
  labels:
    app.opendatahub.io/networkpolicy: 'true'
spec:
  podSelector:
    matchLabels:
      app: odh-notebook-controller
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Webhook calls from the kube-apiserver may originate from the node network rather than a pod.
  # Webhook server (TCP 8443): reached by the kube-apiserver (via the
  # Konnectivity proxy on ROKS). Port-scoped, no peer restriction.
  # kube-apiserver webhook calls originate from the host network
  # (or the Konnectivity proxy on managed platforms); NetworkPolicy peer
  # selectors cannot reliably match this traffic.
  - ports:
    - protocol: TCP
      port: 8443
  # Permit metrics scraping only from the platform monitoring namespaces.
  # Metrics (TCP 8080): restrict to cluster-monitoring namespaces.
  - ports:
    - protocol: TCP
      port: 8080
    from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: opendatahub-monitoring
  # Kubelet health probes may originate from the node network rather than a pod.
  # Health/readiness probes (TCP 8081): port-scoped, no peer restriction.
  # Kubelet probes originate from the node host network and cannot be
  # constrained by NetworkPolicy peer selectors.
  - ports:
    - protocol: TCP
      port: 8081
  # Allow-all egress: the controller reaches the kube-apiserver (dynamic
  # endpoint), DNS, user-namespace Services, and external webhook endpoints
  # that cannot be reliably represented by stable NetworkPolicy peers.
  egress:
  - {}
