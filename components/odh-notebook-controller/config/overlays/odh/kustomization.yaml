apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../openshift
configMapGenerator:
- behavior: merge
  envs:
  - params.env
  name: odh-notebook-controller-image-parameters
replacements:
- source:
    fieldPath: data.odh-notebook-controller-image
    kind: ConfigMap
    name: odh-notebook-controller-image-parameters
    version: v1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.image
    select:
      group: apps
      kind: Deployment
      name: odh-notebook-controller-manager
      version: v1
- source:
    fieldPath: metadata.namespace
    group: monitoring.coreos.com
    kind: ServiceMonitor
    name: odh-notebook-controller-metrics-monitor
    version: v1
  targets:
  - fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: .
      index: 1
    select:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: odh-notebook-controller-metrics-monitor
      version: v1
